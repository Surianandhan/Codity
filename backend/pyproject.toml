[project]
name = "codity-scheduler"
version = "0.1.0"
description = "Distributed job scheduler on PostgreSQL"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "croniter>=6.0",
    "uuid-utils>=0.10",
    "httpx>=0.28",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["concurrency: tests requiring real committed sessions"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = []
